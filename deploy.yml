name: Publish Mesto
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-mesto
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_MESTO_TOKEN: ${{ secrets.VITE_MESTO_TOKEN }}
          VITE_MESTO_COHORT: ${{ secrets.VITE_MESTO_COHORT }}
      - name: Publish build to public repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: ${{ vars.PAGES_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
